server_tokens off;

log_format assetcare_json escape=json
    '{"timestamp":"$time_iso8601","method":"$request_method","path":"$uri","status":$status,"request_duration":$request_time}';

server {
    listen 80;
    server_name _;

    access_log /dev/stdout assetcare_json;
    access_log /var/log/nginx/access.json assetcare_json;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /stub_status {
        return 404;
    }

    location / {
        proxy_pass http://app:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }
}

server {
    listen 8080;
    server_name _;

    location = /stub_status {
        stub_status;
        access_log off;
    }

    location / {
        return 404;
    }
}
