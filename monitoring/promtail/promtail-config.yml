server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: assetcare_nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: assetcare_nginx
          service: nginx
          __path__: /var/log/nginx/access.json
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            method: method
            path: path
            status: status
            request_duration: request_duration
      - timestamp:
          source: timestamp
          format: RFC3339
